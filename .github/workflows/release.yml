name: Build desktop apps
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish after checks pass (leave empty for build only)'
        required: false
        default: ''
        type: string
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: windows-2025
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.4.0'
      - name: Fetch and verify portable runtime
        run: node scripts/fetch-runtime.mjs ${{ matrix.target }}
      - name: Test source without device writes
        run: node --test app/test/*.test.mjs
      - name: Build desktop app and installer
        shell: bash
        run: |
          set -o pipefail
          node scripts/package-release.mjs ${{ matrix.target }} 2>&1 | tee desktop-build.log
      - name: Show packaging diagnostics
        if: failure()
        shell: bash
        run: |
          if [ -f desktop-build.log ]; then
            echo '### Desktop packaging diagnostics' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -c 24000 desktop-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Mac window and service lifecycle smoke test
        if: matrix.target == 'macos-arm64'
        shell: bash
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("app/package.json")).version')
          "dist/Rapoo-Local-$version-macos-arm64/Rapoo Local.app/Contents/MacOS/RapooLocal" --smoke-test
          node --input-type=module -e 'try { await fetch("http://127.0.0.1:8765/api/info"); process.exit(1); } catch {}'
      - name: Windows window and service lifecycle smoke test
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $version = (Get-Content app/package.json | ConvertFrom-Json).version
          $app = Resolve-Path "dist/Rapoo-Local-$version-windows-x64/Rapoo Local.exe"
          $process = Start-Process -FilePath $app -ArgumentList '--smoke-test' -PassThru
          if (!$process.WaitForExit(60000)) { $process.Kill(); throw 'Desktop smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Desktop smoke test failed' }
          if (Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction SilentlyContinue) { throw 'Desktop left its app service running' }
      - name: Windows install, launch and uninstall check
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $version = (Get-Content app/package.json | ConvertFrom-Json).version
          $install = Join-Path $env:RUNNER_TEMP 'Rapoo Local Installed'
          $setup = Resolve-Path "dist/Rapoo-Local-$version-windows-x64-setup.exe"
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$install`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installation failed' }
          $process = Start-Process -FilePath (Join-Path $install 'Rapoo Local.exe') -ArgumentList '--smoke-test' -PassThru
          if (!$process.WaitForExit(60000)) { $process.Kill(); throw 'Installed app timed out' }
          if ($process.ExitCode -ne 0) { throw 'Installed app smoke test failed' }
          if (Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction SilentlyContinue) { throw 'Installed app left its service running' }
          $process = Start-Process -FilePath (Join-Path $install 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path (Join-Path $install 'Rapoo Local.exe')) { throw 'Uninstall left the launcher behind' }
      - name: Package source
        if: matrix.target == 'macos-arm64'
        run: node scripts/package-release.mjs source
      - uses: actions/upload-artifact@v4
        with:
          name: Rapoo-Local-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*setup.exe
            dist/*.sha256
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' || inputs.release_tag != ''
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Rapoo-Local-*
          merge-multiple: true
          path: release-files
      - name: Verify checksums and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [ "$GITHUB_EVENT_NAME" = push ]; then tag="$GITHUB_REF_NAME"; fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo 'Invalid release tag'; exit 1; }
          version=$(node -p 'JSON.parse(require("fs").readFileSync("app/package.json")).version')
          [[ "$tag" = "v$version" || "$tag" = "v$version-"* ]] || { echo 'Tag must match app version'; exit 1; }
          (cd release-files && sha256sum -c ./*.sha256)
          test -f "release-files/Rapoo-Local-$version-macos-arm64.dmg"
          test -f "release-files/Rapoo-Local-$version-windows-x64-setup.exe"
          flags=()
          if [[ "$tag" = *-* ]]; then flags+=(--prerelease); fi
          gh release create "$tag" release-files/* --target "$GITHUB_SHA" --title "Rapoo Local $tag" --notes-file docs/RELEASE-NOTES.md "${flags[@]}"
